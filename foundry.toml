[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
ffi = false
# One Foundry call walks the whole lifecycle. Converting 5,000 holders does not fit in 2e9.
gas_limit = 8_000_000_000
fs_permissions = [{ access = "read", path = "./" }]
auto_detect_remappings = false
gas_reports = [
    "GvShare",
    "GvVotesWrapper",
    "GvGovernor",
    "GvDividend",
    "GvKitFactory",
    "GvDirectory",
    "GvCompanyRules",
    "GvAssembly",
    "GvInformation",
    "GvShareTerms",
    "GvAcquisition",
    "GvRecovery",
]

[profile.default.fuzz]
runs = 64

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
number_underscore = "thousands"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api", chain = 8453 }
