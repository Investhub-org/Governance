name: test

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.9.0
      - name: forge test
        run: forge test

  deadlines:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: lifecycle deadline tests
        run: node --experimental-strip-types --test lifecycle/deadlines/test/deadlines.test.ts
