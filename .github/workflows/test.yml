name: test

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.9.0
      - name: check the investor book
        run: python3 sim/generate.py --holders 32 --check sim/fixtures/book-32.json
      - name: forge test
        run: forge test
